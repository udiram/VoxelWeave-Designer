name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-engine:
    name: Contracts and engine
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Install engine test dependencies
        run: python -m pip install --disable-pip-version-check -e 'engine[test]'
      - name: Run contracts and engine gates
        env:
          VOXELWEAVE_REQUIRE_PYTHON_TOOLS: "1"
        run: pnpm run check:contracts

  desktop:
    name: Desktop lint, tests, build, and Chromium adapter E2E
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Install Chromium for browser adapter E2E
        run: pnpm --dir apps/desktop exec playwright install chromium
      - name: Run desktop gates (Chromium/test-adapter coverage)
        run: pnpm run check:desktop
      - name: Build the arm64 sidecar and run JSONL cross-runtime smoke
        run: |
          set -euo pipefail
          scripts/build-sidecar.sh --output "$RUNNER_TEMP/voxelweave-sidecar"
          python3 scripts/cross-runtime-e2e.py --sidecar "$RUNNER_TEMP/voxelweave-sidecar"
      - name: Build native Tauri app and DMG
        run: |
          set -euo pipefail
          scripts/build-tauri-release.sh \
            --target aarch64-apple-darwin \
            --output-dir "$RUNNER_TEMP/voxelweave-desktop-bundle"
      - name: Smoke the packaged native app and sidecar bridge
        run: |
          set -euo pipefail
          app_path="$(cat "$RUNNER_TEMP/voxelweave-desktop-bundle/app-path.txt")"
          python3 scripts/native-app-smoke.py \
            --app "$app_path" \
            --output-dir "$RUNNER_TEMP/voxelweave-native-app-smoke"
      - name: Qualify representative Apple Silicon sidecar performance
        run: |
          set -euo pipefail
          app_path="$(cat "$RUNNER_TEMP/voxelweave-desktop-bundle/app-path.txt")"
          sidecar_path="$(find "$app_path/Contents/Resources" -type f -name voxelweave-sidecar -print -quit)"
          [[ -n "$sidecar_path" ]] || { echo "error: packaged app sidecar was not found" >&2; exit 1; }
          python3 scripts/benchmark-sidecar.py \
            --sidecar "$sidecar_path" \
            --output-dir "$RUNNER_TEMP/voxelweave-native-performance"
      - name: Upload native release-QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-release-qa
          path: |
            ${{ runner.temp }}/voxelweave-native-app-smoke
            ${{ runner.temp }}/voxelweave-native-performance
          if-no-files-found: warn
      - name: Upload desktop bundle for architecture inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-bundle
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          if-no-files-found: ignore

  site-service:
    name: Site and release API lint, tests, build, and Chromium adapter E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Install Chromium for browser adapter E2E
        run: pnpm --dir apps/site exec playwright install --with-deps chromium
      - name: Run site and service gates (Chromium/test-adapter coverage)
        run: pnpm run check:site-service
      - name: Build combined Railway bundle
        run: pnpm run railway:bundle -- --output-dir "$RUNNER_TEMP/voxelweave-railway-bundle"

  architecture-inspection:
    name: Native architecture inspection
    needs: desktop
    runs-on: macos-14
    if: always()
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download desktop native bundle when available
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: desktop-native-bundle
          path: ${{ runner.temp }}/desktop-native-bundle
      - name: Inspect every Mach-O architecture
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/desktop-native-bundle"
          if [[ -d "$native_root" ]] && find "$native_root" -type f -print -quit | grep -q .; then
            scripts/inspect-architectures.sh --require-mach-o "$native_root"
          elif [[ "$DESKTOP_RESULT" == "success" ]]; then
            echo "error: desktop job passed but no native bundle was uploaded" >&2
            exit 1
          else
            echo "[architecture] no desktop bundle was uploaded; inspection remains pending integration"
          fi
      - name: Inspect native extensions inside the one-file sidecar payload
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/desktop-native-bundle"
          sidecar_path="$(find "$native_root" -type f -name voxelweave-sidecar -print -quit 2>/dev/null || true)"
          if [[ -n "$sidecar_path" ]]; then
            scripts/inspect-native-payload.py \
              --sidecar "$sidecar_path" \
              --report "$native_root/native-payload-architecture.json"
          elif [[ "$DESKTOP_RESULT" == "success" ]]; then
            echo "error: desktop job passed but no packaged sidecar was uploaded" >&2
            exit 1
          else
            echo "[native-payload] no desktop sidecar was uploaded; inspection remains pending integration"
          fi
      - name: Run controlled architecture rejection fixtures
        run: scripts/tests/test_architectures.sh
      - name: Run controlled one-file payload rejection fixtures
        run: scripts/tests/test_native_payload.sh
      - name: Upload native architecture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-native-architecture
          path: ${{ runner.temp }}/desktop-native-bundle/native-payload-architecture.json
          if-no-files-found: warn

  release-evidence:
    name: Release evidence and repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate release evidence verifier
        run: pnpm run test:release-evidence
      - name: Check local documentation links
        run: pnpm run check:links
      - name: Parse workflow YAML and platform boundary
        run: pnpm run check:workflows
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml
