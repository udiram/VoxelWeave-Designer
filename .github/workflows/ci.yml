name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts-engine:
    name: Contracts and engine
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install Python quality tools
        run: python -m pip install --disable-pip-version-check ruff mypy pytest
      - name: Run contracts and engine gates
        env:
          VOXELWEAVE_REQUIRE_PYTHON_TOOLS: "1"
        run: pnpm run check:contracts

  desktop:
    name: Desktop lint, tests, build, and Playwright
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Run desktop gates
        run: pnpm run check:desktop
      - name: Upload desktop bundle for architecture inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-native-bundle
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          if-no-files-found: ignore

  site-service:
    name: Site and release API lint, tests, build, and Playwright
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Run site and service gates
        run: pnpm run check:site-service
      - name: Build combined Railway bundle
        run: pnpm run railway:bundle -- --output-dir "$RUNNER_TEMP/voxelweave-railway-bundle"

  architecture-inspection:
    name: Native architecture inspection
    needs: desktop
    runs-on: macos-14
    if: always()
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download desktop native bundle when available
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: desktop-native-bundle
          path: "$RUNNER_TEMP/desktop-native-bundle"
      - name: Inspect every Mach-O architecture
        run: |
          set -euo pipefail
          native_root="$RUNNER_TEMP/desktop-native-bundle"
          if [[ -d "$native_root" ]] && find "$native_root" -type f -print -quit | grep -q .; then
            scripts/inspect-architectures.sh --require-mach-o "$native_root"
          else
            echo "[architecture] no desktop bundle was uploaded; inspection remains pending integration"
          fi
      - name: Run controlled architecture rejection fixtures
        run: scripts/tests/test_architectures.sh

  release-evidence:
    name: Release evidence and repository checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate release evidence verifier
        run: pnpm run test:release-evidence
      - name: Check local documentation links
        run: pnpm run check:links
      - name: Parse workflow YAML and platform boundary
        run: pnpm run check:workflows
