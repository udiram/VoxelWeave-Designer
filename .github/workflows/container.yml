name: Publish Railway container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "services/release-api/**"
      - ".github/workflows/container.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/release-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/udiram/voxelweave-designer:latest
            ghcr.io/udiram/voxelweave-designer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/udiram/VoxelWeave-Designer
            org.opencontainers.image.revision=${{ github.sha }}
