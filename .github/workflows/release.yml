name: Release VoxelWeave Designer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Use stable only for a tagged public release; development-prerelease is explicitly not notarized."
        required: true
        type: choice
        options:
          - development-prerelease
          - stable
        default: development-prerelease

permissions:
  contents: write

jobs:
  release:
    name: Build, inspect, and publish Apple Silicon release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'stable' || (inputs.channel || 'development-prerelease') }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Resolve release channel and version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_tag="$GITHUB_REF_NAME"
          else
            if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
              echo "error: stable releases must come from a v*.*.* tag" >&2
              exit 1
            fi
            version="development-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
            release_tag="development-${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_OUTPUT=$RUNNER_TEMP/voxelweave-release"
          } >> "$GITHUB_ENV"
      - name: Build Tauri app and DMG
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUTPUT"
          scripts/build-tauri-release.sh \
            --target aarch64-apple-darwin \
            --output-dir "$RELEASE_OUTPUT/bundle"
      - name: Sign and notarize according to the release lane
        run: |
          set -euo pipefail
          scripts/sign-and-notarize.sh \
            --app "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            --dmg "$(cat "$RELEASE_OUTPUT/bundle/dmg-path.txt")" \
            --channel "$RELEASE_CHANNEL" \
            --status-file "$RELEASE_OUTPUT/signing.json"
      - name: Inspect every native component
        run: |
          set -euo pipefail
          scripts/inspect-architectures.sh \
            --require-mach-o \
            "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            > "$RELEASE_OUTPUT/architecture-report.txt"
      - name: Package uploadable release assets
        run: |
          set -euo pipefail
          scripts/package-release-assets.sh \
            --app "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            --dmg "$(cat "$RELEASE_OUTPUT/bundle/dmg-path.txt")" \
            --output-dir "$RELEASE_OUTPUT/assets" \
            --version "$RELEASE_VERSION"
      - name: Create checksums and evidence manifest
        run: |
          set -euo pipefail
          python3 scripts/create-release-evidence.py \
            --artifact-dir "$RELEASE_OUTPUT/assets" \
            --output-dir "$RELEASE_OUTPUT" \
            --version "$RELEASE_VERSION" \
            --git-sha "$GITHUB_SHA" \
            --channel "$RELEASE_CHANNEL" \
            --signing-status-file "$RELEASE_OUTPUT/signing.json" \
            --architecture-report "$RELEASE_OUTPUT/architecture-report.txt"
      - name: Verify evidence and checksums
        run: |
          set -euo pipefail
          python3 scripts/verify-release-evidence.py \
            --schema scripts/release-evidence.schema.json \
            --manifest "$RELEASE_OUTPUT/release-evidence.json" \
            --artifact-root "$RELEASE_OUTPUT"
      - name: Upload release build evidence
        uses: actions/upload-artifact@v4
        with:
          name: voxelweave-${{ env.RELEASE_VERSION }}-evidence
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VoxelWeave Designer ${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'development-prerelease' }}
          draft: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_OUTPUT }}/assets/*.zip
            ${{ env.RELEASE_OUTPUT }}/assets/*.dmg
            ${{ env.RELEASE_OUTPUT }}/SHA256SUMS
            ${{ env.RELEASE_OUTPUT }}/release-evidence.json
