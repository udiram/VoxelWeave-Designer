name: Release VoxelWeave Designer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Use stable only for a tagged public release; development-prerelease is explicitly not notarized."
        required: true
        type: choice
        options:
          - development-prerelease
          - stable
        default: development-prerelease

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Build, inspect, and publish Apple Silicon release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'stable' || (inputs.channel || 'development-prerelease') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Resolve release channel and version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            release_tag="$GITHUB_REF_NAME"
          else
            if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
              echo "error: stable releases must come from a v*.*.* tag" >&2
              exit 1
            fi
            version="0.1.${GITHUB_RUN_NUMBER}"
            release_tag="development-${GITHUB_RUN_NUMBER}"
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_OUTPUT=$RUNNER_TEMP/voxelweave-release"
          } >> "$GITHUB_ENV"
      - name: Require green CI for the exact source revision
        run: |
          set -euo pipefail
          successful_runs="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 20 \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "error: no successful CI run exists for $GITHUB_SHA" >&2
            exit 1
          fi
      - name: Build Tauri app and DMG
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUTPUT"
          scripts/build-tauri-release.sh \
            --target aarch64-apple-darwin \
            --version "$RELEASE_VERSION" \
            --output-dir "$RELEASE_OUTPUT/bundle"
      - name: Sign and notarize according to the release lane
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          scripts/sign-and-notarize.sh \
            --app "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            --dmg "$(cat "$RELEASE_OUTPUT/bundle/dmg-path.txt")" \
            --channel "$RELEASE_CHANNEL" \
            --status-file "$RELEASE_OUTPUT/signing.json"
      - name: Inspect every native component
        run: |
          set -euo pipefail
          scripts/inspect-architectures.sh \
            --require-mach-o \
            "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            > "$RELEASE_OUTPUT/architecture-report.txt"
      - name: Package uploadable release assets
        run: |
          set -euo pipefail
          scripts/package-release-assets.sh \
            --app "$(cat "$RELEASE_OUTPUT/bundle/app-path.txt")" \
            --dmg "$(cat "$RELEASE_OUTPUT/bundle/dmg-path.txt")" \
            --output-dir "$RELEASE_OUTPUT/assets" \
            --version "$RELEASE_VERSION"
      - name: Create checksums and evidence manifest
        run: |
          set -euo pipefail
          python3 scripts/create-release-evidence.py \
            --artifact-dir "$RELEASE_OUTPUT/assets" \
            --output-dir "$RELEASE_OUTPUT" \
            --version "$RELEASE_VERSION" \
            --git-sha "$GITHUB_SHA" \
            --channel "$RELEASE_CHANNEL" \
            --signing-status-file "$RELEASE_OUTPUT/signing.json" \
            --architecture-report "$RELEASE_OUTPUT/architecture-report.txt"
      - name: Verify evidence and checksums
        run: |
          set -euo pipefail
          python3 scripts/verify-release-evidence.py \
            --schema scripts/release-evidence.schema.json \
            --manifest "$RELEASE_OUTPUT/release-evidence.json" \
            --artifact-root "$RELEASE_OUTPUT"
      - name: Upload release build evidence
        uses: actions/upload-artifact@v7
        with:
          name: voxelweave-${{ env.RELEASE_VERSION }}-evidence
          path: ${{ env.RELEASE_OUTPUT }}
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: VoxelWeave Designer ${{ env.RELEASE_VERSION }}
          prerelease: ${{ env.RELEASE_CHANNEL == 'development-prerelease' }}
          draft: false
          body: |
            ${{ env.RELEASE_CHANNEL == 'development-prerelease' && 'Development prerelease for controlled testing. This build has a verified ad-hoc integrity seal, but is not Developer ID-signed or notarized; do not use it for clinical decisions or patient care.' || 'Stable Apple Silicon release, Developer ID-signed and notarized through the fail-closed production lane.' }}

            Source revision: `${{ github.sha }}`

            Validation evidence:
            - [x] Unit + integration — passed for this source revision in GitHub CI
            - [x] Desktop E2E — passed for desktop and 390 px responsive workspace flows
            - [x] Accessibility — automated keyboard, landmark, label, and contrast checks passed
            - [x] Architecture — every shipped Mach-O component inspected as Apple Silicon arm64
            - [x] Release checksum — SHA-256 manifest generated and verified before publication

            Real DICOM remains local. Physical HU and deposited-width claims still require scan-back verification.
          files: |
            ${{ env.RELEASE_OUTPUT }}/assets/*.zip
            ${{ env.RELEASE_OUTPUT }}/assets/*.dmg
            ${{ env.RELEASE_OUTPUT }}/SHA256SUMS
            ${{ env.RELEASE_OUTPUT }}/architecture-report.txt
            ${{ env.RELEASE_OUTPUT }}/release-evidence.json
