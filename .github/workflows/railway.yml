name: Railway bundle

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Build and, only when explicitly true, deploy the operator-owned Railway service."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    name: Build combined site and release API bundle
    runs-on: ubuntu-24.04
    env:
      BUNDLE_DIR: ${{ runner.temp }}/voxelweave-railway-bundle
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - name: Install workspace dependencies
        run: pnpm run setup
      - name: Build site and release API staging bundle
        env:
          VOXELWEAVE_REQUIRE_RAILWAY_WORKSPACES: "1"
        run: pnpm run railway:bundle -- --output-dir "$BUNDLE_DIR"
      - name: Upload Railway bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: voxelweave-railway-bundle
          path: ${{ env.BUNDLE_DIR }}
      - name: Deploy only after explicit workflow confirmation
        if: ${{ inputs.deploy == true }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT }}
        run: scripts/deploy-railway.sh --bundle-dir "$BUNDLE_DIR" --confirm
