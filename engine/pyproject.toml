[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxelweave-engine"
version = "0.1.0"
description = "Deterministic research-use DICOM-to-G-code engine for VoxelWeave Designer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pydicom>=2.4,<4",
]

[project.scripts]
voxelweave-sidecar = "voxelweave.sidecar:main"

[project.optional-dependencies]
scipy = ["scipy>=1.11,<2"]
geometry = ["manifold3d>=3,<4"]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "scipy>=1.11,<2",
]
release = [
  "pyinstaller>=6.10,<7",
  "scipy>=1.11,<2",
  "manifold3d>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
exclude = ["tests"]
