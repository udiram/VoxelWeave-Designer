[build]
builder = "RAILPACK"
buildCommand = "corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile && pnpm --dir apps/site build && pnpm --dir services/release-api build"

[deploy]
startCommand = "node services/release-api/dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
